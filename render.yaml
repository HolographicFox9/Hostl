services:
  - type: web
    name: hostl-multiplayer
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTL_SESSION_SECRET
        generateValue: true
      - key: HOSTL_RECOVERY_SECRET
        generateValue: true
