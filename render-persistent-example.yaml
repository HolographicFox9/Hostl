# OPTIONAL PAID PRODUCTION BLUEPRINT EXAMPLE
# Render Free web services cannot attach persistent disks. Use this as a reference only
# if you choose a paid web-service compute plan and want accounts.json to survive restarts.
services:
  - type: web
    name: hostl-multiplayer
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    disk:
      name: hostl-account-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTL_SESSION_SECRET
        generateValue: true
      - key: HOSTL_RECOVERY_SECRET
        generateValue: true
      - key: HOSTL_DATA_DIR
        value: /var/data/hostl
